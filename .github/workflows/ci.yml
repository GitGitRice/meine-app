name: CI
on: # yamllint disable-line rule:truthy
  push:
  pull_request:
env:
  PYTHON_VERSION: "3.12"
  APP_ENV: "staging"
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Python installieren
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -v

      - name: Konfiguration anzeigen
        run: echo "Python ${{ env.PYTHON_VERSION }} in ${{ env.APP_ENV }}"

      - name: Umgebung wechseln
        env:
          APP_ENV: production
        run: echo "Step sieht ${{ env.APP_ENV }}"

      - name: Lauf-Informationen anzeigen
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Runner: ${{ runner.os }}"

      - name: Deploy vorbereiten
        if: github.ref == 'refs/heads/main'
        run: echo "Deploy wird vorbereitet"

      - name: Version ermitteln
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/
          
      - name: Build-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment-Platzhalter
        run: echo "Deployment für ${{ github.ref_name }}"
      
      - name: Version ausgeben
        run: echo "Deploying Version ${{ needs.test.outputs.version }}"