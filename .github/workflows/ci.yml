name: CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.12" # Python-Version für die Tests
  APP_ENV: "staging" # Umgebung für die Tests

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pip-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -v

      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/

      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/

      - name: Deploy vorbereiten
        if: github.ref == 'refs/heads/main'
        run: echo "Deploy startet"

      - name: Version ermitteln
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      


  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build-Artifact herunterladen
        uses: actions/download-artifact@v4
        with:
          name: app-paket
          path: build/

      - name: Deployment-Platzhalter
        run: echo "Deployment läuft in ${{ env.APP_ENV }}"

      - name: Version ausgeben
        run: echo "Deploying Version ${{ needs.test.outputs.version }}"